<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Классрук</title>

  <meta name="description" content="Список класса с контактами учеников и родителей">
  <meta name="theme-color" content="#F8F9FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">

  <!-- Установка на домашний экран (iOS / Android) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Классрук">
  <link rel="icon" href="icons/icon-192.png">

  <style>
    :root {
      --bg: #F8F9FF;
      --surface: #FFFFFF;
      --surface-variant: #E0E2EC;
      --on-bg: #1A1B20;
      --on-surface-variant: #5B5E66;
      --primary: #1F5FA8;
      --primary-container: #D6E3FF;
      --on-primary-container: #001B3F;
      --divider: #E4E6EE;
      --shadow: 0 1px 3px rgba(20, 30, 60, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --surface: #1B1E24;
        --surface-variant: #2B2F37;
        --on-bg: #E1E2E8;
        --on-surface-variant: #A8ABB5;
        --primary: #A9C7FF;
        --primary-container: #274B7E;
        --on-primary-container: #D6E3FF;
        --divider: #2E323B;
        --shadow: 0 1px 3px rgba(0, 0, 0, .45);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* hidden должен побеждать любые display-правила ниже (иначе модальное окно
       перекрывало весь экран невидимым слоем) */
    [hidden] { display: none !important; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--on-bg);
      min-height: 100vh; min-height: 100dvh;
    }
    a { color: inherit; text-decoration: none; }

    .appbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 4px;
      padding: calc(env(safe-area-inset-top) + 8px) 8px 8px;
      background: var(--bg);
    }
    .appbar h1 {
      flex: 1; margin: 0; padding: 0 8px;
      font-size: 20px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border: 0; border-radius: 50%;
      background: transparent; color: var(--on-bg); cursor: pointer;
    }
    .icon-btn:active { background: var(--surface-variant); }
    .icon-btn:disabled { opacity: .35; }

    main { max-width: 640px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom) + 24px); }

    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap svg.lead {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--on-surface-variant); pointer-events: none;
    }
    #searchInput {
      width: 100%; padding: 13px 44px; border-radius: 26px;
      border: 1px solid var(--divider); outline: none;
      background: var(--surface); color: var(--on-bg);
      font-size: 16px; box-shadow: var(--shadow);
    }
    #searchInput:focus { border-color: var(--primary); }
    #clearSearch {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px;
    }

    .progress { height: 3px; border-radius: 2px; background: var(--surface-variant); overflow: hidden; margin-bottom: 10px; }
    .progress::after {
      content: ""; display: block; height: 100%; width: 40%;
      background: var(--primary); border-radius: 2px;
      animation: slide 1s ease-in-out infinite alternate;
    }
    @keyframes slide { from { transform: translateX(-60%); } to { transform: translateX(220%); } }

    .card {
      display: block; background: var(--surface); border-radius: 14px;
      box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden;
    }
    .student-card { display: flex; align-items: center; padding: 14px 16px; }
    .student-card:active { background: var(--surface-variant); }
    .student-card .body { flex: 1; min-width: 0; }
    .student-card .name { font-size: 16px; font-weight: 600; }
    .student-card .parents {
      margin-top: 3px; font-size: 13px; color: var(--on-surface-variant);
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .student-card > svg { color: var(--on-surface-variant); flex-shrink: 0; }

    .section {
      margin: 18px 4px 8px; font-size: 13px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; color: var(--primary);
    }

    .header-card { display: flex; align-items: center; padding: 16px; }
    .avatar {
      width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
      background: var(--primary-container); color: var(--on-primary-container);
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; font-weight: 600;
    }
    .header-card .info { margin-left: 16px; min-width: 0; }
    .header-card .info .name { font-size: 19px; font-weight: 600; }
    .header-card .info .klass { margin-top: 2px; font-size: 14px; color: var(--on-surface-variant); }

    .contact {
      display: flex; align-items: center; padding: 10px 16px; min-height: 58px;
    }
    .contact:active { background: var(--surface-variant); }
    .contact > svg.lead { color: var(--primary); flex-shrink: 0; }
    .contact .body { flex: 1; min-width: 0; margin-left: 14px; }
    .contact .label { font-size: 11px; letter-spacing: .04em; color: var(--on-surface-variant); }
    .contact .value { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
    .contact.missing { color: var(--on-surface-variant); }
    .contact .actions { display: flex; flex-shrink: 0; }
    .contact .actions .icon-btn { color: var(--primary); width: 38px; height: 38px; }
    .divider { height: 1px; background: var(--divider); margin-left: 46px; }

    .parent-name { display: flex; align-items: center; padding: 14px 16px 4px; }
    .parent-name svg { color: var(--primary); }
    .parent-name .name { margin-left: 12px; font-size: 16px; font-weight: 600; }

    .empty {
      padding: 56px 24px; text-align: center; color: var(--on-surface-variant);
    }
    .empty svg { color: var(--primary); }
    .empty h2 { margin: 14px 0 6px; font-size: 17px; color: var(--on-bg); }
    .empty p { margin: 0 0 22px; font-size: 14px; line-height: 1.5; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border: 0; border-radius: 24px; cursor: pointer;
      background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    }
    @media (prefers-color-scheme: dark) { .btn { color: #002F67; } }
    .btn:active { opacity: .85; }

    #toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
      transform: translateX(-50%); z-index: 50;
      max-width: calc(100vw - 48px); padding: 11px 18px; border-radius: 10px;
      background: #2B2F37; color: #fff; font-size: 14px; text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(10, 14, 24, .5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal {
      background: var(--surface); border-radius: 16px; padding: 22px;
      max-width: 340px; width: 100%; box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 8px; font-size: 17px; }
    .modal p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: var(--on-surface-variant); }
    .modal .row { display: flex; justify-content: flex-end; gap: 8px; }
    .modal button {
      border: 0; background: transparent; cursor: pointer;
      padding: 9px 14px; border-radius: 18px; font-size: 14px; font-weight: 600;
      color: var(--primary);
    }
    .modal button:active { background: var(--surface-variant); }
  </style>
</head>
<body>
  <header class="appbar">
    <button id="btnBack" class="icon-btn" hidden aria-label="Назад">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1 id="title">Классрук</h1>
    <button id="btnImport" class="icon-btn" aria-label="Импорт из МЭШ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    </button>
    <button id="btnExport" class="icon-btn" aria-label="Экспорт в Excel" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
  </header>

  <main id="main"></main>

  <div id="toast" hidden></div>
  <div id="modal" class="modal-backdrop" hidden></div>
  <input type="file" id="fileInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
